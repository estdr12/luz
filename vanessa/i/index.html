/* Barra contenedora (Rosa) */
/* Barra contenedora (Rosa) - Centrado Absoluto */
.barra {
  width: 100%;                  /* Ocupa el total disponible en pantallas muy chicas */
  max-width: 280px;             /* 👈 MODIFICA ESTO: Ajusta aquí el ancho de la barra (ej: 250px, 300px) */
  height: 4px;                  /* Grosor de la línea */
  background: #c4698a !important;
  border-radius: 0px !important;
  cursor: pointer;
  
  /* Márgenes y Alineación a prueba de fallos */
  margin: 20px auto !important; /* Centra horizontalmente en navegadores estándar */
  align-self: center !important;/* 🔥 FUERZA el centrado si el contenedor usa Flexbox */
  
  position: relative;
  overflow: visible !important; /* Permite que el círculo sobresalga arriba y abajo */
}

/* Línea blanca de progreso */
.progreso {
  height: 100%;
  width: 0%;
  background: #c4698a;
  border-radius: 0px;
  position: relative;           /* Ancla la burbuja a su extremo derecho */
  overflow: visible !important; /* 🔥 Impide que se corte la burbuja al inicio */
}

/* El círculo perfecto (Blindado contra deformaciones) */
/* El círculo perfecto (Blindado contra deformaciones) */
.burbuja {
  display: block !important;
  position: absolute;
  
  /* Lo posicionamos en la pura esquina derecha de la barra blanca */
  right: 0;
  top: 50%;
  
  /* El truco del margen negativo evita que el círculo altere el ancho de la barra */
  margin-right: -7px; 
  
  /* 🔥 FIX: translateZ(0) fuerza la aceleración por hardware en la GPU */
  transform: translateY(-50%) translateZ(0) !important;
  
  /* 🔥 FIX: Evita el parpadeo y la deformación de bordes en movimiento */
  backface-visibility: hidden !important;
  outline: 1px solid transparent !important; 
  -webkit-backface-visibility: hidden !important;
  
  /* Dimensiones fijas e inalterables */
  width: 14px !important;
  height: 14px !important;
  min-width: 14px !important;
  min-height: 14px !important;
  
  /* Forzamos geometría circular */
  aspect-ratio: 1 / 1 !important;
  border-radius: 50% !important;
  box-sizing: border-box !important;
  
  /* Estilo visual */
  background: #c4698a !important;
  
  /* Evita interferencias en dispositivos táctiles */
  pointer-events: none !important; 
}

.sello {
  position: absolute;
  top: 55%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 3;
  pointer-events: none;

  width: 110px !important;
  height: auto !important;

  animation: brilloSello 2s ease-in-out infinite;
}

.sello img {
  width: 100% !important;
  height: auto !important;
  display: block;
}


@keyframes brilloSello {
  0% {
    filter: brightness(1);
  }
  50% {
    filter: brightness(1.2);
  }
  100% {
    filter: brightness(1);
  }
}

  position: absolute;
  top: -8%;
  left: 0;
  width: 100%;
  z-index: 2;
  transition: transform 3s ease, opacity 2s ease;
}

/* Parte inferior */
.sobre-abajo {
  position: relative;
  z-index: 1;
  transition: transform 3s ease;
}

/* Estado abierto */
#portada-sobre.abierto .sobre-arriba {
  transform: translateY(-100%);
  opacity: 0;
}

#portada-sobre.abierto .sobre-abajo {
  transform: translateY(100%);
}

/* Ocultar portada */
#portada-sobre.oculto {
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s ease;

<script>
const fechaEvento = new Date("2026-08-08T21:00:00");

function actualizarContador() {
  const ahora = new Date();
  const diferencia = fechaEvento - ahora;

  if (diferencia <= 0) return;

  const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
  const horas = Math.floor((diferencia / (1000 * 60 * 60)) % 24);
  const minutos = Math.floor((diferencia / (1000 * 60)) % 60);
  const segundos = Math.floor((diferencia / 1000) % 60);

  document.getElementById("dias").textContent = dias;
  document.getElementById("horas").textContent = horas.toString().padStart(2, "0");
  document.getElementById("minutos").textContent = minutos.toString().padStart(2, "0");
  document.getElementById("segundos").textContent = segundos.toString().padStart(2, "0");
}

actualizarContador();
setInterval(actualizarContador, 1000);
</script>

<script>
function activarFormulario(formId, btnId, modo = "bloquear") {
  const form = document.getElementById(formId);
  const btn = document.getElementById(btnId);

  if (!form || !btn) return;

  const textoOriginal = btn.textContent;

  form.addEventListener("submit", function() {

    // ⏱️ Espera un pelín para que el navegador mande los datos
    setTimeout(() => {
      form.reset(); // ✅ ahora sí se borra sin romper el envío
    }, 10);

    // Animación del botón (independiente del borrado)
    setTimeout(() => {

      btn.textContent = "Enviado";
      btn.classList.add("boton-enviado");
      btn.style.cursor = "default";

      if (modo === "bloquear") {
        btn.disabled = true;
      }

      if (modo === "resetear") {
        setTimeout(() => {
          btn.textContent = textoOriginal;
          btn.classList.remove("boton-enviado");
          btn.style.cursor = "pointer";
          btn.disabled = false;
        }, 2000);
      }

    }, 100);
  });
}

// Formulario 1: se bloquea
activarFormulario("rsvpForm1", "rsvpBtn1", "bloquear");

// Formulario 2: se puede volver a usar
activarFormulario("rsvpForm2", "rsvpBtn2", "resetear");
</script>


<script>
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add("visible");
    }
  });
}, { threshold: 0.2 });

document.querySelectorAll(".seccion").forEach(el => observer.observe(el));

<script>
const canciones = [
  { nombre: "Dance The Night - Dua Lipa", src: "../music/Dance.mp3" },
  { nombre: "I Don't Want To Talk - Wallows", src: "../music/Dont.mp3" }
];

let indice = 0;
const audio = document.getElementById("audio");
const progress = document.getElementById("progress");
const songTitle = document.getElementById("songTitle");
const playBtn = document.getElementById("playBtn");

function cargarCancion() {
  audio.src = canciones[indice].src;
  songTitle.textContent = canciones[indice].nombre;
}

function playPause() {
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}


function siguiente() {
  indice = (indice + 1) % canciones.length;
  cargarCancion();
  audio.play();
}

function anterior() {
  indice = (indice - 1 + canciones.length) % canciones.length;
  cargarCancion();
  audio.play();
}


function actualizarBotonPlay() {
  playBtn.src = "../img/jugar.webp";
}

function actualizarBotonPause() {
  playBtn.src = "../img/pausa.webp";
}


audio.addEventListener("timeupdate", () => {
  if (!audio.duration) return;
  const porcentaje = (audio.currentTime / audio.duration) * 100;
  progress.style.width = porcentaje + "%";
});

document.getElementById("progressBar").addEventListener("click", e => {
  const ancho = e.currentTarget.clientWidth;
  audio.currentTime = (e.offsetX / ancho) * audio.duration;
});

audio.addEventListener("play", actualizarBotonPause);
audio.addEventListener("pause", actualizarBotonPlay);
audio.addEventListener("ended", siguiente);

cargarCancion();
</script>

<script>
document.addEventListener("touchstart", e => {
  if (e.touches.length > 1) return; // no multitouch

  const target = e.target;

  if (
    target.closest(".imagen-abajo img") ||
    target.closest(".hero img") ||
    target.closest(".hero video")
  ) {
    // NO uses preventDefault aquí
    target.style.webkitTouchCallout = "none";
  }
});

</script>
